<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<style>
  :root {
    --bg:#0b0f14; --panel:#121821; --panel2:#171f2b; --card:#1a2330; --line:#232e3d;
    --text:#f2f5f9; --muted:#9aa7b5; --accent:#f5a524; --green:#2ecc71; --red:#ff5d5d;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  .shell { display:flex; min-height:100vh; }
  nav { width:200px; background:var(--panel); border-right:1px solid var(--line); padding:16px 10px; display:flex; flex-direction:column; gap:6px; }
  nav .logo { font-weight:800; font-size:16px; padding:8px 10px 16px; }
  nav button {
    text-align:left; padding:12px 14px; border-radius:12px; border:1px solid transparent;
    background:transparent; color:var(--muted); font-size:14.5px; font-weight:700; cursor:pointer;
  }
  nav button.active { background:var(--panel2); color:var(--text); border-color:var(--line); }
  main { flex:1; padding:22px 26px; max-width:1200px; }
  h2 { margin:0 0 16px; font-size:20px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .stat .l { font-size:12px; color:var(--muted); letter-spacing:1px; }
  .stat .v { font-size:22px; font-weight:800; margin-top:4px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13.5px; }
  th { color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  tr:last-child td { border-bottom:none; }
  .pill { padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .pill.paid { background:#10221a; color:#9be8c0; }
  .pill.pending { background:#2a2313; color:#ffd479; }
  .pill.new { background:#13202a; color:#8fd0ff; }
  .pill.preparing { background:#2a2313; color:#ffd479; }
  .pill.ready { background:#10221a; color:#9be8c0; }
  .pill.completed { background:#1a1f2a; color:#9aa7b5; }
  .pill.printed { background:#10221a; color:#9be8c0; }
  .pill.failed { background:#2a1315; color:#ffb4b4; }
  .btn {
    height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:13px; font-weight:700; cursor:pointer;
  }
  .btn.primary { background:var(--accent); color:#171207; border-color:var(--accent); }
  .btn.danger { background:#2a1315; color:#ffb4b4; border-color:#5c2a2e; }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
  input, select, textarea {
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:9px 12px; font-size:14px; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus { outline:1px solid var(--accent); }
  .menu-tree { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 0; }
  .cat-row, .item-row { display:flex; align-items:center; gap:10px; padding:10px 14px; }
  .cat-row { border-bottom:1px solid var(--line); font-weight:800; }
  .item-row { padding-left:34px; font-size:14px; }
  .item-row .price { color:var(--accent); font-weight:700; margin-left:auto; }
  .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .muted { color:var(--muted); font-size:12.5px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:900px){ .grid2 { grid-template-columns:1fr; } nav { width:64px; } nav button span.lbl{display:none;} }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label { font-size:12.5px; color:var(--muted); font-weight:700; letter-spacing:0.5px; }
  .field .row { display:flex; gap:10px; align-items:center; }
  .switch { display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:14px; }
  .pre {
    background:#0d1117; border:1px solid var(--line); border-radius:14px; padding:18px;
    font-family:"SF Mono", Menlo, Consolas, monospace; font-size:13px; line-height:1.5;
    white-space:pre-wrap; color:#d7e0ea; max-width:420px;
  }
  .toast { position:fixed; bottom:20px; right:20px; background:#10221a; color:#9be8c0;
    border:1px solid #1f5c40; padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; z-index:99; }
  .toast.err { background:#2a1315; color:#ffb4b4; border-color:#5c2a2e; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:min(480px,92vw); max-height:86vh; overflow:auto; }
  .modal h3 { margin:0 0 14px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="shell">
  <nav id="nav">
    <div class="logo">🚚 ADMIN</div>
    <button data-view="dashboard" class="active">📊 <span class="lbl">Dashboard</span></button>
    <button data-view="orders">🧾 <span class="lbl">Orders</span></button>
    <button data-view="menu">🌯 <span class="lbl">Menu</span></button>
    <button data-view="billing">🧮 <span class="lbl">Billing</span></button>
    <button data-view="printer">🖨 <span class="lbl">Printer</span></button>
    <button data-view="settings">⚙️ <span class="lbl">Settings</span></button>
    <button id="logout" style="margin-top:auto; color:#ff8f8f;">🚪 <span class="lbl">Logout</span></button>
  </nav>
  <main id="main"></main>
</div>
<script src="/admin.js"></script>
</body>
</html>
