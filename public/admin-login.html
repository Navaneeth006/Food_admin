<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0f14; color: #f2f5f9; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #121821; border: 1px solid #232e3d; border-radius: 18px;
    padding: 34px 40px; width: min(360px, 90vw); text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 20px; color: #9aa7b5; font-size: 13px; }
  input {
    width: 100%; box-sizing: border-box; height: 56px; border-radius: 14px;
    border: 1px solid #232e3d; background: #171f2b; color: #f2f5f9;
    font-size: 24px; text-align: center; letter-spacing: 8px; outline: none;
  }
  button {
    width: 100%; height: 54px; margin-top: 14px; border: none; border-radius: 14px;
    background: #f5a524; color: #171207; font-size: 17px; font-weight: 800;
  }
  .err { color: #ff5d5d; font-size: 14px; min-height: 20px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Staff Access</h1>
    <p>Enter the admin PIN</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••" autofocus>
    <button id="go">UNLOCK</button>
    <div class="err" id="err"></div>
  </div>
  <script>
    const pin = document.getElementById('pin');
    const err = document.getElementById('err');
    async function submit() {
      err.textContent = '';
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pin: pin.value }),
      });
      if (r.ok) { location.href = '/admin'; return; }
      const d = await r.json().catch(() => ({}));
      err.textContent = d.message || 'Incorrect PIN';
      pin.value = '';
      pin.focus();
    }
    document.getElementById('go').addEventListener('click', submit);
    pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    pin.focus();
  </script>
</body>
</html>
