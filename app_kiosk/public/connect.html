<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Kiosk</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: white;
      }
      .wrap {
        max-width: 820px;
        margin: 40px auto;
        padding: 24px;
      }
      .box {
        background: rgba(31, 41, 55, 0.9);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      }
      h1 { margin-top: 0; }
      .link {
        display: block;
        background: #f59e0b;
        color: #111827;
        font-weight: 700;
        border-radius: 12px;
        padding: 16px;
        margin: 16px 0;
        text-decoration: none;
        text-align: center;
      }
      .small { opacity: 0.8; font-size: 14px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .card {
        background: #1f2937;
        border-radius: 12px;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="box">
        <h1>Phone Kiosk Server</h1>
        <p class="small">Use this phone as the server. Open the iPad kiosk from the address below.</p>

        <a id="kioskLink" class="link" href="/kiosk.html">Open iPad Kiosk</a>
        <a class="link" href="/admin.html" style="background:#10b981; color:white;">Open Admin</a>

        <div class="grid">
          <div class="card">
            <h3>iPad URL</h3>
            <p id="ipadUrl">http://<phone-ip>:4242/kiosk.html</p>
          </div>
          <div class="card">
            <h3>Admin URL</h3>
            <p id="adminUrl">http://<phone-ip>:4242/admin.html</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const host = location.hostname === 'localhost' ? 'localhost' : location.hostname;
      const base = `${location.protocol}//${host}:4242`;
      document.getElementById('kioskLink').href = `${base}/kiosk.html`;
      document.getElementById('ipadUrl').textContent = `${base}/kiosk.html`;
      document.getElementById('adminUrl').textContent = `${base}/admin.html`;
    </script>
  </body>
</html>
