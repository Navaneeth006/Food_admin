<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Kiosk</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #111827; color: white; }
      .container { max-width: 900px; margin: 0 auto; padding: 24px; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
      .item { background: #1f2937; padding: 16px; border-radius: 12px; }
      .item button { width: 100%; background: #f59e0b; border: none; border-radius: 8px; padding: 10px; font-weight: 700; }
      .cart { background: #1f2937; border-radius: 12px; padding: 16px; margin-top: 20px; }
      .cart-item { display: flex; justify-content: space-between; margin-bottom: 12px; }
      .pay-btn { margin-top: 16px; width: 100%; background: #10b981; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 18px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Food Kiosk</h1>
        <span id="status">Online</span>
      </div>

      <p id="connection-message" role="status">Loading menu...</p>
      <div id="menu" class="menu"></div>

      <div class="cart">
        <h2>Cart</h2>
        <div id="cart-items"></div>
        <div class="cart-item"><strong>Total</strong> <strong id="total">₹0</strong></div>
        <button class="pay-btn" onclick="placeOrder()">Place order</button>
      </div>
    </div>

    <script>
      const state = {
        menu: [],
        cart: []
      };

      async function loadMenu() {
        const message = document.getElementById('connection-message');
        try {
          const res = await fetch('/api/menu');
          if (!res.ok) throw new Error('The phone server returned an error.');
          const data = await res.json();
          if (!Array.isArray(data.menu) || data.menu.length === 0) throw new Error('No menu items are available.');
          state.menu = data.menu;
          message.textContent = '';
          document.getElementById('status').textContent = 'Online';
          renderMenu();
        } catch (error) {
          message.textContent = error.message + ' Check that the phone server is on and both devices use the same Wi-Fi.';
          document.getElementById('status').textContent = 'Offline';
        }
      }

      function renderMenu() {
        const menu = document.getElementById('menu');
        menu.innerHTML = state.menu.map(item => `
          <div class="item">
            <h3>${item.name}</h3>
            <p>₹${item.price}</p>
            <button onclick="addToCart(${item.id})">Add to cart</button>
          </div>
        `).join('');
      }

      function addToCart(id) {
        const item = state.menu.find(x => x.id === id);
        if (!item) return;

        const existing = state.cart.find(x => x.id === id);
        if (existing) existing.qty += 1;
        else state.cart.push({ ...item, qty: 1 });

        renderCart();
      }

      function renderCart() {
        const list = document.getElementById('cart-items');
        list.innerHTML = state.cart.map(item => `
          <div class="cart-item">
            <span>${item.name} x ${item.qty}</span>
            <span>₹${item.price * item.qty}</span>
          </div>
        `).join('');

        const total = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
        document.getElementById('total').textContent = `₹${total}`;
      }

      async function placeOrder() {
        if (!state.cart.length) return alert('Cart is empty');

        try {
          const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cart: state.cart, customerName: 'iPad Customer' })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Order could not be placed.');
          alert(`Order placed successfully: #${data.order.id}`);
          state.cart = [];
          renderCart();
        } catch (error) {
          alert(error.message + ' Check the phone server and try again.');
        }
      }

      loadMenu();
    </script>
  </body>
</html>
