name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'foodtruck-apk/**'
      - 'app_kiosk/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        working-directory: foodtruck-apk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-truck-kiosk-debug-apk
          path: foodtruck-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to release
        # Runs only when the push carries a v* tag. On plain pushes this step
        # is skipped and the APK is available under the run's Artifacts.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: foodtruck-apk/app/build/outputs/apk/debug/app-debug.apk

  build-app-kiosk:
    name: Build phone-hosted kiosk APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app_kiosk/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        working-directory: app_kiosk
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: app_kiosk
        run: npx cap sync android

      - name: Build phone-hosted kiosk APK
        working-directory: app_kiosk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload phone-hosted kiosk APK
        uses: actions/upload-artifact@v4
        with:
          name: app-kiosk-debug-apk
          path: app_kiosk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
